# Nightly snapshot of the Supabase data into a SEPARATE PRIVATE repository.
#
# WHY IT PUSHES SOMEWHERE ELSE
# This repository is public. The snapshot contains congregation contact details
# -- roster_member_meta holds names, emails, phone numbers, notes and suspension
# reasons, and pic_users holds names and phones. Committing that here would
# publish it permanently: git history keeps it even after a delete, and public
# repositories are indexed and scraped. So the data goes to a private repo and
# `backups/` is in .gitignore here to make the mistake hard to make by hand.
#
# WHY A REPO AND NOT A CLOUD BACKUP
# Supabase Pro includes daily backups kept 7 days; Point-in-Time Recovery is a
# $100/month add-on. This costs nothing, keeps far more than 7 days, and lives
# outside Supabase -- a backup inside the system it is backing up protects
# against almost nothing. Each run overwrites the same files, so every commit
# is a restore point and git stores only what changed.
#
# SETUP (once)
#   1. Create a new PRIVATE repo, e.g. jermaineaaron1/LHC-Prep-Backups.
#      Tick "Add a README" so it is not empty.
#   2. Make a fine-grained personal access token with Contents: Read and write
#      on THAT repo only. https://github.com/settings/personal-access-tokens
#   3. In THIS repo: Settings -> Secrets and variables -> Actions -> New
#      repository secret, named BACKUP_REPO_TOKEN, pasting the token.
#   4. If you named the repo something else, change BACKUP_REPO below.
#
# Run it by hand the first time from the Actions tab to check the setup.
#
# IF IT BREAKS, IT SAYS SO
# This ran and failed every night for over a month without anybody noticing:
# 35 runs, 35 failures, zero successes, because the setup above was never
# done. A red cross in the Actions tab of a repository nobody opens is not a
# notification. So a failed run now opens an issue, which emails whoever
# watches this repo.
#
# The notifier deliberately uses GITHUB_TOKEN, not BACKUP_REPO_TOKEN: the
# missing token IS the most likely failure, and a warning that needs the
# broken thing in order to warn you is no warning at all.

name: Backup Supabase

on:
  schedule:
    # 18:00 UTC = 02:00 Malaysia, after Saturday-night service prep is done.
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  BACKUP_REPO: jermaineaaron1/LHC-Prep-Backups

concurrency:
  group: backup-supabase
  cancel-in-progress: false

# Spelled out because the issue step needs to write one. Naming any
# permission drops every other to none, so contents: read is here for the
# checkout rather than by accident.
permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the app (for the exporter and the Supabase key)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export every table
        # Fails the run on a short read rather than writing a truncated
        # snapshot -- see the comment in tools/export-supabase.js.
        run: node tools/export-supabase.js

      - name: Push the snapshot to the private repo
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "BACKUP_REPO_TOKEN is not set. See the setup notes at the top of this file."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BACKUP_REPO}.git" target
          # Replace wholesale so a table dropped from the export list also
          # disappears from the snapshot, rather than lingering forever.
          rm -rf target/backups
          cp -r backups target/backups
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backups
          if git diff --cached --quiet; then
            echo "No changes since the last snapshot."
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
          echo "Pushed a new snapshot to ${BACKUP_REPO}."

      # Only when something above failed. Runs even then, which is the point.
      - name: Say so, if the backup did not happen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly Supabase backup is failing
        run: |
          set -euo pipefail

          # The body goes in a file so the fallback below can reuse it
          # without the whole thing being written out twice.
          cat > /tmp/backup-issue.md <<EOF
          The scheduled backup did not complete.

          **Run:** ${RUN_URL}

          Nothing reached \`${BACKUP_REPO}\` for this run, so there is no
          off-site copy of today's data. The app has no second database, so
          until this is fixed a mistake in the roster or the song library can
          only be undone by hand.

          **The usual cause** is that the one-time setup was never finished, or
          that the token has expired -- fine-grained tokens last a year at most.
          The steps are in the header of
          \`.github/workflows/backup-supabase.yml\`:

          1. A **private** repo \`${BACKUP_REPO}\`
          2. A fine-grained token with **Contents: Read and write** on that repo only
          3. A repository secret here named \`BACKUP_REPO_TOKEN\`

          Read the run log first. If it says \`BACKUP_REPO_TOKEN is not set\`,
          it is one of those three. Anything else -- a short read, a table that
          would not page -- means the exporter stopped rather than writing a
          truncated snapshot, and the log names the table.

          Close this once a run goes green. If it fails again afterwards, a new
          issue opens.
          EOF

          # One open issue, not one a night: 365 issues saying the same thing
          # is the Actions tab again, with email on top. The open issue IS the
          # signal, and closing it while the cause stands means the next
          # failure opens a fresh one, which is what you want.
          #
          # Matched on the exact title rather than on a label. A label has to
          # exist before it can be filtered on, and tying the only warning this
          # job has to a thing that might not be there is how you end up with
          # a notifier that cannot notify.
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
                       --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} is already open for this. Leaving it alone."
            exit 0
          fi

          gh label create backup-failure \
            --description "The nightly Supabase backup did not run" \
            --color B60205 2>/dev/null || true

          # Labelled if the label took, unlabelled if it did not. Being told
          # beats being told tidily.
          gh issue create --title "${TITLE}" --body-file /tmp/backup-issue.md \
                          --label backup-failure \
            || gh issue create --title "${TITLE}" --body-file /tmp/backup-issue.md
          echo "Opened an issue."
